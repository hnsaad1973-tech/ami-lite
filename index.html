<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AMI Lite</title>
<style>
  :root{
    --navy:#16304F; --navy2:#1F3F66; --gold:#C79A3C; --bg:#F4F6FA;
    --ink:#182333; --muted:#6B7482; --line:#E3E8F0; --user:#16304F; --bot:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
    padding:14px 18px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 10px rgba(0,0,0,.15);z-index:5;}
  header .logo{width:34px;height:34px;border-radius:9px;background:var(--gold);color:var(--navy);
    display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.5px;}
  header .t{font-weight:700;font-size:17px;}
  header .s{font-size:11px;color:#AFC0DC;margin-top:1px;}
  header .out{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:none;
    padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
  #chat{flex:1;overflow-y:auto;padding:18px 14px 8px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.5;
    white-space:pre-wrap;word-wrap:break-word;animation:pop .2s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:5px;}
  .bot{align-self:flex-start;background:var(--bot);color:var(--ink);border:1px solid var(--line);
    border-bottom-left-radius:5px;box-shadow:0 1px 4px rgba(20,40,70,.05);}
  .err{align-self:flex-start;background:#FDECEC;color:#8A2A2A;border:1px solid #F3C9C9;
    border-radius:12px;font-size:13.5px;}
  .welcome{align-self:center;text-align:center;color:var(--muted);font-size:14px;
    max-width:300px;margin:auto 0;line-height:1.6;}
  .welcome b{color:var(--navy);display:block;font-size:17px;margin-bottom:6px;}
  .dots{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:#fff;
    border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:#B9C3D4;animation:bob 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.15s;} .dots i:nth-child(3){animation-delay:.3s;}
  @keyframes bob{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-4px);}}
  footer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;
    border-top:1px solid var(--line);display:flex;gap:9px;align-items:flex-end;}
  #box{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;font-size:16px;
    font-family:inherit;resize:none;max-height:140px;outline:none;line-height:1.4;}
  #box:focus{border-color:var(--gold);}
  #send{width:46px;height:46px;flex:0 0 46px;border:none;border-radius:50%;background:var(--navy);
    color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center;transition:.15s;}
  #send:active{transform:scale(.92);} #send:disabled{background:#B9C3D4;cursor:default;}
  /* login */
  #gate{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;z-index:20;}
  #gate .card{background:#fff;border-radius:18px;padding:30px 24px;width:100%;max-width:340px;text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.3);}
  #gate .logo{width:52px;height:52px;border-radius:13px;background:var(--gold);color:var(--navy);
    display:grid;place-items:center;font-weight:800;font-size:19px;margin:0 auto 14px;}
  #gate h1{font-size:20px;color:var(--navy);margin-bottom:5px;}
  #gate p{font-size:13.5px;color:var(--muted);margin-bottom:18px;line-height:1.5;}
  #gate input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;
    font-size:16px;font-family:inherit;outline:none;margin-bottom:11px;}
  #gate input:focus{border-color:var(--gold);}
  #gate button{width:100%;border:none;border-radius:11px;padding:13px;background:var(--navy);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  #gate .note{font-size:13px;margin-top:14px;min-height:18px;}
  #gate .note.ok{color:#1A6B3F;} #gate .note.bad{color:#8A2A2A;}
  .hidden{display:none!important;}
</style>
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="gate">
    <div class="card">
      <div class="logo">AI</div>
      <h1>Sign in to AMI Lite</h1>
      <p>Enter your email and we'll send you a secure sign-in link.</p>
      <input id="email" type="email" placeholder="you@email.com" autocomplete="email">
      <button id="magic">Send sign-in link</button>
      <div class="note" id="note"></div>
    </div>
  </div>

  <!-- APP -->
  <header class="hidden" id="appHeader">
    <div class="logo">AI</div>
    <div><div class="t">AMI Lite</div><div class="s">Powered by Claude</div></div>
    <button class="out" id="logout">Sign out</button>
  </header>
  <div id="chat" class="hidden">
    <div class="welcome" id="welcome"><b>Hello 👋</b>Ask me anything — type your question below and press send.</div>
  </div>
  <footer class="hidden" id="appFooter">
    <textarea id="box" rows="1" placeholder="Type your message…"></textarea>
    <button id="send" aria-label="Send">➤</button>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
  // ===== CONFIG (AMI Lite) =====
  const SUPABASE_URL = "https://pdzhlslzwjlhxklqcwus.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_vHhWZVOnyl7_qQicqcYn2A_rZVvfYsd";
  const FUNCTION_URL = SUPABASE_URL + "/functions/v1/ai";
  const SITE_URL = "https://hnsaad1973-tech.github.io/ami-lite/";
  // =============================

  const sb = supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY);

  const gate = document.getElementById("gate");
  const note = document.getElementById("note");
  const appHeader = document.getElementById("appHeader");
  const appFooter = document.getElementById("appFooter");
  const chat = document.getElementById("chat");
  const box = document.getElementById("box");
  const send = document.getElementById("send");
  const welcome = document.getElementById("welcome");
  let history = [];
  let busy = false;

  // --- auth ---
  document.getElementById("magic").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) { note.textContent = "Please enter your email."; note.className = "note bad"; return; }
    note.textContent = "Sending…"; note.className = "note";
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: SITE_URL } });
    if (error) { note.textContent = error.message; note.className = "note bad"; }
    else { note.textContent = "Check your email for the sign-in link."; note.className = "note ok"; }
  });
  document.getElementById("logout").addEventListener("click", async () => {
    await sb.auth.signOut(); show(false);
  });

  function show(loggedIn){
    gate.classList.toggle("hidden", loggedIn);
    appHeader.classList.toggle("hidden", !loggedIn);
    appFooter.classList.toggle("hidden", !loggedIn);
    chat.classList.toggle("hidden", !loggedIn);
  }
  sb.auth.getSession().then(({ data }) => show(!!data.session));
  sb.auth.onAuthStateChange((_e, session) => show(!!session));

  // --- chat ---
  box.addEventListener("input", () => { box.style.height="auto"; box.style.height=Math.min(box.scrollHeight,140)+"px"; });
  box.addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submit(); } });
  send.addEventListener("click", submit);

  function add(text, cls){
    const d = document.createElement("div"); d.className="msg "+cls; d.textContent=text;
    chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
  }
  function typing(){
    const d = document.createElement("div"); d.className="dots"; d.innerHTML="<i></i><i></i><i></i>";
    chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
  }

  async function submit(){
    const text = box.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    if (welcome) welcome.remove();
    add(text, "user");
    history.push({ role:"user", content:text });
    box.value=""; box.style.height="auto";
    const dots = typing();
    try {
      const { data:{ session } } = await sb.auth.getSession();
      const res = await fetch(FUNCTION_URL, {
        method:"POST",
        headers: { "Content-Type":"text/plain", "Authorization":"Bearer "+(session?session.access_token:"") },
        body: JSON.stringify({ messages: history })
      });
      dots.remove();
      const raw = await res.text();
      let data; try { data = JSON.parse(raw); } catch { data = raw; }
      if (!res.ok) {
        add("Error "+res.status+": "+(typeof data==="string"?data:(data.error||raw)).toString().slice(0,300), "err");
      } else {
        const reply = extract(data);
        add(reply, "bot");
        history.push({ role:"assistant", content:reply });
      }
    } catch (e) { dots.remove(); add("Connection problem: "+e.message, "err"); }
    busy = false; send.disabled = false; box.focus();
  }

  function extract(d){
    if (typeof d === "string") return d;
    if (d.content && Array.isArray(d.content) && d.content[0] && d.content[0].text) return d.content[0].text;
    if (typeof d.reply === "string") return d.reply;
    if (typeof d.message === "string") return d.message;
    if (typeof d.text === "string") return d.text;
    if (d.response) return typeof d.response==="string"?d.response:JSON.stringify(d.response);
    return JSON.stringify(d);
  }
</script>
</body>
</html>
